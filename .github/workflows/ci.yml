name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - run: go test -timeout 2m ./...
      - run: go vet ./...
      - run: go build ./cmd/clauflip
  binaries:
    needs: test
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        goarch: [amd64, arm64]
        target:
          - goos: windows
            runner: ubuntu-latest
            cgo: '0'
          - goos: linux
            runner: ubuntu-latest
            cgo: '0'
          - goos: darwin
            runner: macos-latest
            cgo: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.target.cgo }}
        run: |
          mkdir -p dist
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -trimpath -o "dist/clauflip-$GOOS-$GOARCH$suffix" ./cmd/clauflip
      - uses: actions/upload-artifact@v7
        with:
          name: clauflip-${{ matrix.target.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
